[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-risk-analyzer-pro"
version = "0.1.0"
description = "Frontend-agnostic contract screening and LegalBERT training starter"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3", "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9", "pymupdf>=1.23", "python-docx>=1.1",
  "pandas>=2.1", "scikit-learn>=1.4"
]
[project.optional-dependencies]
training = ["torch>=2.2", "transformers>=4.39,<5", "datasets>=2.18", "accelerate>=0.28"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.3"]
[tool.setuptools.packages.find]
include = ["contract_risk*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
